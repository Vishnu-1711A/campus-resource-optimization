{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">Campus Resource Optimization System</p>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@pes.edu" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
    </form>
    <p class="auth-switch">New here? <a href="/register">Create an account</a></p>
    <p class="auth-hint">Demo admin: <code>anuradha.bhat@pes.edu</code> / <code>pes@123</code></p>
</div>
{% endblock %}
